[package]
name = "echobird-account-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "multipart", "http2"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
http-body-util = "0.1"
url = "2"
futures-util = "0.3"
bytes = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
dirs = "6"
log = "0.4"
regex = "1"
image = "0.25"
flate2 = "1"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
