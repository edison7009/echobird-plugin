name: Validate registry

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  native:
    name: Native account module (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.93 --profile minimal --component clippy,rustfmt
      - run: cargo +1.93 fmt --manifest-path native/account-engine/Cargo.toml --check
      - run: cargo +1.93 clippy --locked --manifest-path native/account-engine/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo +1.93 test --locked --manifest-path native/account-engine/Cargo.toml

  mirror:
    name: Mirror main to GitCode
    needs: [validate, native]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: gitcode-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push validated main
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then
            echo '::error::Configure the GITCODE_TOKEN repository secret before mirroring.'
            exit 1
          fi
          export GIT_ASKPASS="$RUNNER_TEMP/echobird-gitcode-askpass.sh"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'edison7009' ;;
            *Password*) printf '%s\n' "$GITCODE_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          git -c credential.helper= -c http.extraHeader= push \
            https://gitcode.com/edison7009/echobird-plugin.git \
            HEAD:refs/heads/main
